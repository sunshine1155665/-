  <div id="login-overlay" class="overlay" hidden>
    <div class="login-card" role="dialog" aria-modal="true" aria-labelledby="login-title" aria-describedby="login-desc">
      <button id="login-close" class="login-close" type="button" aria-label="关闭令牌对话框">
        <svg viewBox="0 0 24 24" aria-hidden="true"><use href="#icon-close"></use></svg>
      </button>
      <div class="login-art" aria-hidden="true">
        <span class="login-halo"></span>
        <span class="login-mark"><svg viewBox="0 0 64 64"><use href="#icon-whale"></use></svg></span>
        <span class="login-bubble login-bubble-a"></span>
        <span class="login-bubble login-bubble-b"></span>
      </div>
      <p class="eyebrow">只属于你的海域</p>
      <h1 id="login-title">先对个暗号吧</h1>
      <p id="login-desc" class="login-desc">把启动终端里那串访问令牌交给我。这片海只认你一个人。</p>
      <form id="login-form" class="login-form" novalidate>
        <label class="field-label" for="token-input">访问令牌</label>
        <input id="token-input" class="input" type="password" name="token" autocomplete="off" spellcheck="false" placeholder="粘贴终端里的令牌" required>
        <p id="login-error" class="form-error" role="alert"></p>
        <button id="login-submit" class="btn btn-primary btn-block" type="submit">游进来</button>
      </form>
      <p class="login-hint">也可以用带 <code>?token=…</code> 的链接打开页面。令牌只保存在这台浏览器的本地存储里。</p>
    </div>
